name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
      - name: Install environment
        run: pixi install
      - name: Validate executed coverage
        run: pixi run test-coverage
      - name: Run optimized test suite
        run: pixi run test
